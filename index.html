<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Explore Beautiful Places</h1>
    <p class="intro">Discover amazing places I would love to visit.</p>
    <p id="message">Choose a destination below.</p>
    <div class="places">
        <div class="place-card">
            <img src="https://adventuremountaintreks.com/media/higest-mountain-in-the-world-mt.-everest.webp" alt="Mountains" class="place-img">
            <h2>Mountain Adventure</h2>
            <p>Explore mountains, fresh air, and panaromic views.</p>
            <button onclick="showMountain()">Explore</button>
        </div>
        <div class="place-card">
            <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/15/17/7f/a5/big-beach.jpg?w=1200&h=-1&s=1" alt="Beach" class="place-img">
            <h2>Sunny Beach</h2>
            <p>Enjoy sunshine, sand, and beautiful blue water.</p>
            <button onclick="showBeach()">Explore</button>
        </div>
        <div class="place-card">
            <img src="https://www.massaudubon.org/var/site/storage/images/2/5/9/0/1830952-1-eng-US/65d513c20021-FR_KForesto-2425-1200x800.jpg" alt="Forest" class="place-img">
            <h2>Green Forest</h2>
            <p>Walk among green trees and peaceful wildlife.</p>
            <button onclick="showForest()">Explore</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
